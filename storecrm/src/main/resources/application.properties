 spring.application.name=storecrm

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/storecrm?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234


# JPA (Hibernate) Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Swagger/OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

## Enable the second-level cache for Hibernate
#spring.jpa.properties.hibernate.cache.use_second_level_cache=true
#spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
#spring.jpa.properties.hibernate.cache.jcache.config=classpath:ehcache.xml
#
## Path to Ehcache configuration file
#spring.jpa.properties.hibernate.cache.ehcache.config=classpath:ehcache.xml
#
## Enable query cache for Hibernate
#spring.jpa.properties.hibernate.cache.use_query_cache=true
#spring.jpa.properties.hibernate.cache.use_structured_entries=true

# Enable logging of request parameters
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG

# Show SQL queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate=INFO

# Format SQL queries for easier reading
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Set root logging level
logging.level.root=INFO
